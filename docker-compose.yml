version: "3.8"

services:

  # ---------- Infra: MySQL (shared instance, 3 databases) ----------
  mysql:
    image: mysql:8.0
    container_name: mysql-foodapp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: system@123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d   # creates userdb, cataloguedb, restaurantdb on first boot
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psystem@123"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - food-app-network

  # ---------- Infra: MongoDB (order service) ----------
  mongo:
    image: mongo:latest
    container_name: mongo-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - food-app-network

  # ---------- Eureka Server ----------
  eureka:
    image: siddhant9960/fa-eureka-server:0.0.1
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      JAVA_OPTS: ""
      LOGSTASH_HOST: logstash
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      - logstash
      - zipkin
    networks:
      - food-app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- User Service (MySQL: userdb) ----------
  user:
    image: siddhant9960/fa-userinfo-service:0.0.1
    container_name: userinfo-service
    restart: unless-stopped
    ports:
      - "9093:9093"
    environment:
      JAVA_OPTS: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-foodapp-db:3306/userdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: system@123
      LOGSTASH_HOST: logstash
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      # JWT_SECRET: ${JWT_SECRET}
    depends_on:
      eureka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - food-app-network

  # ---------- Order Service (Mongo: order_db, calls User) ----------
  order:
    image: siddhant9960/fa-order-service:0.0.1
    container_name: order-service
    restart: unless-stopped
    ports:
      - "9097:9097"
    environment:
      JAVA_OPTS: ""
      EUREKA_SERVER_URL: http://eureka:8761/eureka
      MONGODB_URI: mongodb://mongo-db:27017/order_db
      LOGSTASH_HOST: logstash
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      eureka:
        condition: service_healthy
      mongo:
        condition: service_started
      user:
        condition: service_started
      logstash:
        condition: service_started
    networks:
      - food-app-network

  # ---------- Restaurant Service (MySQL: restaurantdb) ----------
  restaurant:
    image: siddhant9960/fa-restaurant-service:0.0.1
    container_name: restaurant-service
    restart: unless-stopped
    ports:
      - "9091:9091"
    environment:
      JAVA_OPTS: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-foodapp-db:3306/restaurantdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: system@123
      LOGSTASH_HOST: logstash
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      eureka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      logstash:
        condition: service_started
    networks:
      - food-app-network

  # ---------- FoodCatalogue Service (MySQL: cataloguedb, calls Restaurant) ----------
  foodcatalogue:
    image: siddhant9960/fa-foodcatalogue-service:0.0.1
    container_name: food-catalogue-service
    restart: unless-stopped
    ports:
      - "9095:9095"
    environment:
      JAVA_OPTS: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-foodapp-db:3306/foodcataloguedb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: system@123
      LOGSTASH_HOST: logstash
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      eureka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      restaurant:
        condition: service_started
      logstash:
        condition: service_started
    networks:
      - food-app-network


  # ---------- API Gateway ----------
  api-gateway:
    image: siddhant9960/fa-api-gateway:0.0.1
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: ""
      EUREKA_SERVER_URL: http://eureka:8761/eureka
      LOGSTASH_HOST: logstash
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      REDIS_HOST: redis
      # JWT_SECRET: ${JWT_SECRET}
    depends_on:
      eureka:
        condition: service_healthy
      user:
        condition: service_started
      order:
        condition: service_started
      restaurant:
        condition: service_started
      foodcatalogue:
        condition: service_started
      redis:
        condition: service_healthy
      logstash:
        condition: service_started
    networks:
      - food-app-network

  # ---------- Observability: Zipkin (distributed tracing) ----------
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - food-app-network

  # ---------- Observability: Elasticsearch (log storage) ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 15
    networks:
      - food-app-network

  # ---------- Observability: Logstash (log ingestion pipeline) ----------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: logstash
    restart: unless-stopped
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5000:5000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - food-app-network

  # ---------- Observability: Kibana (log visualization UI) ----------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - food-app-network

  # ---------- Infra: Redis (rate limiting) ----------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - food-app-network


  # ---------- Angular Frontend ----------
  frontend:
    image: siddhant9960/fa-foodapp-angular:0.0.1
    container_name: food-app-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - eureka
      - user
      - order
      - restaurant
      - foodcatalogue
      - api-gateway
    networks:
      - food-app-network


networks:
  food-app-network:
    driver: bridge

volumes:
  mysql-data:
  mongo-data: