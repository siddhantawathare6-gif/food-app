<!-- register.component.html -->
<div class="auth-container">
  <div class="auth-box">
    <h2>Create Account</h2>

    <div class="form-group">
      <label for="name">Full Name</label>
      <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="John Doe" />
    </div>

    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" type="text" [(ngModel)]="username" name="username" placeholder="johndoe123" />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="••••••••" />
    </div>

    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button class="auth-button" (click)="onRegister()">Register</button>

    <p class="switch-auth">
      Already have an account? <a (click)="goToLogin()">Login here</a>
    </p>
  </div>
</div>
