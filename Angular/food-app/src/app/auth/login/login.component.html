<!-- login.component.html -->
<div class="auth-container">
  <div class="auth-box">
    <h2>Login</h2>

    <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>

    <div class="form-group">
      <label for="emailOrUsername">Email or Username</label>
      <input id="emailOrUsername" type="text" [(ngModel)]="emailOrUsername" name="emailOrUsername" placeholder="you@example.com or username" />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="••••••••" />
    </div>

    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button class="auth-button" (click)="onLogin()">Login</button>

    <p class="switch-auth">
      Don't have an account? <a (click)="goToRegister()">Register here</a>
    </p>
  </div>
</div>
