<header class="header">
    <div class="header-container">
      <h1 class="header-logo">Siddhant's Food Delivery</h1>
      <nav class="header-nav">
        <div class="user-avatar">
            <img src="assets/avatar-pics/avatar.jpg" alt="User Avatar">
            <span class="username" *ngIf="username">Hey {{ username }}</span>
            <span class="username" *ngIf="!username">Hey User</span>
            <button class="logout-btn" *ngIf="username" (click)="logout()">Logout</button>
        </div>
      </nav>
    </div>
</header>
