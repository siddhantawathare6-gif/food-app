server:
  port: ${CONFIG_SERVER_PORT:8888}

spring:
  application:
    name: ${APP_NAME:config-server}
  profiles:
    active: ${CONFIG_PROFILE:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_PATH:file:../config-repo}
        git:
          uri: ${CONFIG_REPO_URI:https://github.com/your-org/food-app-config}
          default-label: ${CONFIG_REPO_BRANCH:main}
          clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
