server:
  port: 8080
spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "http://localhost:4200"
                allowed-methods: "*"
                allowed-headers: "*"
          routes:
            - id: userinfo-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/auth/**,/user/**
            - id: foodcatalogue-service
              uri: lb://FOOD-CATALOGUE-SERVICE
              predicates:
                - Path=/foodCatalogue/**
            - id: restaurant-service
              uri: lb://RESTAURANT-SERVICE
              predicates:
                - Path=/restaurant/**
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/order/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true