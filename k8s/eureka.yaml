apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  labels:
    app: eureka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: siddhant9960/fa-eureka-server:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          env:
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
---
apiVersion: v1
kind: Service
metadata:
  name: eureka
spec:
  selector:
    app: eureka
  ports:
    - port: 8761
      targetPort: 8761
