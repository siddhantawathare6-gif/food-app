server:
  port: ${RESTAURANT_PORT:9091}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/restaurantdb}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:system@123}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    defer-datasource-initialization: true
  sql:
    init:
      mode: ${SQL_INIT_MODE:ALWAYS}
      data-locations: classpath:sql/data.sql
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

app:
  image:
    upload-dir: ${IMAGE_UPLOAD_DIR:uploads/restaurants}
    base-url: ${IMAGE_BASE_URL:/restaurant/image}