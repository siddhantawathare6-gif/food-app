server:
  port: ${GATEWAY_PORT:8080}

management:
  endpoints:
    gateway:
      enabled: true

spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
                allowed-methods: "*"
                allowed-headers: "*"
          discovery:
            locator:
              lower-case-service-id: true
          routes:
            - id: restaurant-images
              uri: lb://restaurant-service
              predicates:
                - Path=/restaurant/image/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RL_IMAGE_REPLENISH:50}
                    redis-rate-limiter.burstCapacity: ${RL_IMAGE_BURST:100}

            - id: userinfo-service
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**,/user/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RL_AUTH_REPLENISH:2}
                    redis-rate-limiter.burstCapacity: ${RL_AUTH_BURST:5}

            - id: foodcatalogue-service
              uri: lb://food-catalogue-service
              predicates:
                - Path=/foodCatalogue/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RL_CATALOGUE_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RL_CATALOGUE_BURST:20}

            - id: restaurant-service
              uri: lb://restaurant-service
              predicates:
                - Path=/restaurant/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RL_RESTAURANT_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RL_RESTAURANT_BURST:20}

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/order/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RL_ORDER_REPLENISH:5}
                    redis-rate-limiter.burstCapacity: ${RL_ORDER_BURST:10}
